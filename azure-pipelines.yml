name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - version_01

pool:
  name: Linux

variables:
  dockerRepository: mycypressframework/cypress
  dockerfilePath: ./Dockerfile.build

steps:
  - checkout: self
    clean: true

  - task: Docker@2
    displayName: Login to DemoCR1
    inputs:
      command: login
      containerRegistry: DemoContainerRegistry1

  - task: Docker@2
    displayName: Build image with SAS_TOKEN
    inputs:
      command: build
      containerRegistry: DemoContainerRegistry1
      Dockerfile: $(dockerfilePath)
      repository: $(dockerRepository)
      arguments: |
        --build-arg SAS_TOKEN=$(SAS_TOKEN)
      tags: |
        $(Build.BuildNumber)

  - task: Docker@2
    displayName: Push image
    inputs:
      command: push
      containerRegistry: DemoContainerRegistry1
      repository: $(dockerRepository)
      tags: |
        $(Build.BuildNumber)

  - task: Docker@2
    displayName: Logout from DemoCR1
    inputs:
      command: logout
      containerRegistry: DemoContainerRegistry1
